name: Dradis Release

on:
  push:
    tags:
      - 'dradis-v**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build_deb_pkg_release:
    name: Build Release Debian Package
    uses: ./.github/workflows/deb_pkg.yml
    strategy:
      matrix:
        distribution-version: [ bookworm, trixie ]
    with:
      distribution-version: ${{ matrix.distribution-version }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ build_deb_pkg_release ]

    steps:
      - name: Download Debian Package Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dradis*.deb
          merge-multiple: true

      - uses: ncipollo/release-action@v1
        with:
          artifacts: dradis*.deb
          generateReleaseNotes: true
